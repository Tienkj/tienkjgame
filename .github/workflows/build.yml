- "v*"

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install pygame pyinstaller

  - name: Check game.py
    run: python -m py_compile game.py

  - name: Build EXE
    run: python -m PyInstaller --onefile --windowed --name TienkjGame game.py

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: TienkjGame-Windows
      path: dist/TienkjGame.exe

  - name: Release EXE
    if: startsWith(github.ref, 'refs/tags/')
    uses: softprops/action-gh-release@v2
    with:
      files: dist/TienkjGame.exe
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
